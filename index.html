<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>CBT-SMAICH - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* --- KEAMANAN GLOBAL: ANTI COPAS, AI, & CETAK --- */
        body { 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none;
        }
        input, textarea, select { 
            -webkit-user-select: auto !important; 
            -ms-user-select: auto !important; 
            user-select: auto !important; 
        }
        @media print { 
            body { display: none !important; } 
        }
    </style>
</head>
<body class="login-page-bg">
    <script>
        (function() {
            // 1. Logika Auto-Theme Berdasarkan Waktu
            const currentHour = new Date().getHours();
            const isNightTime = currentHour >= 18 || currentHour < 6;
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
                document.body.classList.add('dark-mode');
                if (!savedTheme) localStorage.setItem('theme', 'dark'); 
            } else if (savedTheme === 'light' || (!savedTheme && !isNightTime)) {
                document.body.classList.remove('dark-mode');
                if (!savedTheme) localStorage.setItem('theme', 'light');
            }

            // 2. Logika Fullscreen Otomatis Giras (Mode ANBK)
            function pemicuFullscreenANBK() {
                const docEl = document.documentElement;
                const isFull = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (!isFull) {
                    if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(() => {}); }
                    else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }
                    else if (docEl.msRequestFullscreen) { docEl.msRequestFullscreen(); }
                }
            }
            window.addEventListener('focus', pemicuFullscreenANBK);
            ['click', 'touchstart', 'keydown', 'mousemove'].forEach(evt => {
                document.addEventListener(evt, pemicuFullscreenANBK, { passive: true });
            });

            // 3. Logika Jam & Tanggal Real-time di Bawah Logo
            function inisialisasiJamSistem() {
                const clockEl = document.getElementById('realtime-clock');
                if (!clockEl) return;
                function perbaruiWaktu() {
                    const sekarang = new Date();
                    const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    const strTanggal = sekarang.toLocaleDateString('id-ID', opsiTanggal);
                    const strJam = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
                    clockEl.innerHTML = `<i class="far fa-calendar-alt"></i> ${strTanggal} &nbsp;|&nbsp; <i class="far fa-clock"></i> ${strJam} WIB`;
                }
                perbaruiWaktu();
                setInterval(perbaruiWaktu, 1000);
            }
            document.addEventListener('DOMContentLoaded', inisialisasiJamSistem);
        })();
    </script>

    <button id="btn-login-dark-mode" class="btn-icon" title="Mode Gelap/Terang" style="position: absolute; top: 20px; right: 20px; font-size: 1.4rem; color: var(--text-muted); border: none; background: transparent; cursor: pointer; padding: 5px; transition: 0.3s; z-index: 1000;">
        <i class="fas fa-moon"></i>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-badge"><i class="fas fa-shield-alt"></i>CBT-SMAICH</span>
                <img src="logo-smaich.png" alt="Logo SMAICH" class="main-logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
                
                <div id="realtime-clock" class="realtime-clock">Menghubungkan waktu server...</div>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label>Username / NIS / NIP</label>
                    <input type="text" id="username" class="input-text" placeholder="Masukkan ID Anda" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-text" placeholder="Masukkan Password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-3d" id="btn-submit" data-default-text="<i class='fas fa-sign-in-alt'></i> MASUK">
                    <i class="fas fa-sign-in-alt"></i> MASUK
                </button>
            
                <a href="javascript:void(0)" id="btn-install-app" class="install-link" aria-hidden="true">
                    <i class="fas fa-download"></i> Instal CBT
                </a>
            
                <div style="margin-top: 20px; font-size: 0.9rem; text-align: center;">
                    Belum punya akun? <a href="registrasi.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">Daftar di sini</a>
                </div>
            </form>
            
            <div class="login-footer" style="margin-top: 20px; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                &copy; 2026 IT Support SMAICH. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        function isStaff() {
            try {
                let roles = JSON.parse(localStorage.getItem("userRole") || "[]");
                return roles.includes("admin") || roles.includes("guru");
            } catch(e) { return false; }
        }

        document.addEventListener("DOMContentLoaded", () => {
            if(isStaff()) {
                document.body.style.userSelect = "auto";
                document.body.style.webkitUserSelect = "auto";
                document.body.style.mozUserSelect = "auto";
                document.body.style.msUserSelect = "auto";
            }

            const darkModeBtn = document.getElementById('btn-login-dark-mode');
            const iconDarkMode = darkModeBtn?.querySelector('i');
            
            if (document.body.classList.contains('dark-mode') && iconDarkMode) {
                iconDarkMode.classList.replace('fa-moon', 'fa-sun');
            }

            darkModeBtn?.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                if (isDark) {
                    iconDarkMode?.classList.replace('fa-moon', 'fa-sun');
                } else {
                    iconDarkMode?.classList.replace('fa-sun', 'fa-moon');
                }
            });
        });

        document.addEventListener('contextmenu', event => { if(!isStaff()) event.preventDefault(); });
        ['copy', 'cut', 'paste', 'selectstart', 'dragstart'].forEach(evt => document.addEventListener(evt, event => { 
            if (!isStaff() && event.target.tagName !== 'INPUT' && event.target.tagName !== 'TEXTAREA') { event.preventDefault(); } 
        }));
        
        document.addEventListener('keydown', event => {
            if(!isStaff()) {
                if (event.key === 'F12' || event.key === 'PrintScreen' || (event.ctrlKey && ['c', 'v', 'x', 'u', 'p', 's', 'a', 'f'].includes(event.key.toLowerCase())) || (event.ctrlKey && event.shiftKey && ['i', 'j', 'c', 's'].includes(event.key.toLowerCase()))) { 
                    event.preventDefault(); 
                }
            }
        });
        
        window.addEventListener('blur', () => { if(!isStaff()) document.body.style.filter = "blur(15px)"; });
        window.addEventListener('focus', () => { if(!isStaff()) document.body.style.filter = "none"; });

        let deferredPrompt; 
        const installBtn = document.getElementById('btn-install-app');
        if (installBtn) {
            installBtn.style.display = 'none';
            window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; installBtn.setAttribute('aria-hidden', 'false'); });
            installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { installBtn.style.display = 'none'; } deferredPrompt = null; } });
        }
    </script>
    <script type="module" src="index.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Gagal: ', err)); });
      }
    </script>
    <button onclick="window.history.back()" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; padding: 10px 15px; background-color: var(--secondary); color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-arrow-left"></i> Kembali
    </button>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            try {
                const roles = JSON.parse(localStorage.getItem('userRole')) || [];
                const isStaff = roles.includes('admin') || roles.includes('guru');
                
                if (isStaff) {
                    // Membuka kunci blokir seleksi teks
                    document.body.style.userSelect = "auto";
                    document.body.style.webkitUserSelect = "auto";
                    document.body.style.mozUserSelect = "auto";
                    document.body.style.msUserSelect = "auto";
                    
                    // Membuka kunci blokir klik kanan
                    window.addEventListener('contextmenu', function(e) {
                        e.stopPropagation();
                    }, true);
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
