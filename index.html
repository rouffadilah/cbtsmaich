<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CBT SMA ICH - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="login-page-bg">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <img src="logo-smaich.png" alt="Logo SMAICH" class="main-logo">
                <h2 id="portal-title">CBT SMAICH</h2>
                <p>SMA ISLAM CIKAL HARAPAN I BSD</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username"><i class="fas fa-id-card"></i> Username / NIS / NIP</label>
                    <input type="text" id="username" class="input-text" placeholder="Masukkan Username Anda" required>
                </div>
                
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" class="input-text" placeholder="Masukkan Password" required>
                </div>

                <button type="submit" id="btn-submit" class="btn-3d">MASUK</button>
                
                <div style="margin-top: 20px; font-size: 0.9rem;">
                    Siswa baru? <a href="registrasi.html">Daftar di sini</a>
                </div>
            </form>
            
            <div class="login-footer">
                &copy; 2026 IT Support SMAICH.<br>All rights reserved.
            </div>
            
        </div>
    </div>

    <script type="module" src="index.js"></script>
    <!-- Pendaftaran Service Worker -->
    <script>
      // Mengecek apakah browser mendukung fitur Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('Service Worker berhasil didaftarkan! Scope: ', registration.scope);
            })
            .catch(err => {
              console.log('Pendaftaran Service Worker gagal: ', err);
            });
        });
      }
    </script>
</body>
</html>
