<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT-SMAICH - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* --- ANTI COPAS & ANTI AI --- */
        body { 
            -webkit-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        input { 
            -webkit-user-select: auto !important; 
            -ms-user-select: auto !important; 
            user-select: auto !important; 
        }
        /* --- ANTI PRINT / PDF --- */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body class="login-page-bg">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <img src="logo-smaich.png" alt="Logo SMAICH" class="main-logo">
                <h2 id="portal-title">CBT-SMAICH</h2>
                <p>SMA ISLAM CIKAL HARAPAN I BSD</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username"><i class="fas fa-id-card"></i> Pengguna / NIP / NIS</label>
                    <input type="text" id="username" class="input-text" placeholder="Input Pengguna" required>
                </div>
                
                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Sandi</label>
                    <input type="password" id="password" class="input-text" placeholder="Masukkan Sandi" required>
                </div>

                <button type="submit" id="btn-submit" class="btn-3d">MASUK</button>
                
                <div style="margin-top: 20px; font-size: 0.9rem; text-align: center;">
                    Siswa baru? <a href="registrasi.html">Daftar di sini</a>
                </div>
            </form>
            
            <div class="login-footer">
                Hak Cipta &copy; 2026<br>Pranata Komputer SMAICH
            </div>
            
        </div>
    </div>

    <script>
        // Blokir Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Blokir Aksi Copy, Cut, dan Paste
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        // Blokir Shortcut Keyboard Pencarian (Ctrl+C, Ctrl+V, Ctrl+F, Inspect Element F12, Print/SS)
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                event.key === 'PrintScreen' ||
                (event.ctrlKey && ['c', 'v', 'x', 'u', 'p', 's', 'a', 'f'].includes(event.key.toLowerCase())) ||
                (event.ctrlKey && event.shiftKey && ['i', 'j', 'c', 's'].includes(event.key.toLowerCase()))
            ) {
                event.preventDefault();
            }
        });
    </script>

    <script type="module" src="index.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('Service Worker berhasil didaftarkan! Scope: ', registration.scope);
            })
            .catch(err => {
              console.log('Pendaftaran Service Worker gagal: ', err);
            });
        });
      }
    </script>
</body>
</html>
