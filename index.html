<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>CBT-SMAICH - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* Proteksi Global */
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
        input, textarea, select { -webkit-user-select: auto !important; -ms-user-select: auto !important; user-select: auto !important; }
        @media print { body { display: none !important; } }
    </style>
</head>
<body class="login-page-bg">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="logo-smaich.png" alt="Logo" class="main-logo" onerror="this.src='https://via.placeholder.com/100?text=CBT'">
                <h2>LOGIN CBT</h2>
                <p>SMA ISLAM CIKAL HARAPAN I BSD</p>
            </div>
            <form id="login-form">
                <div class="input-group"><label>NIS / ID Guru</label><input type="text" id="username" class="input-text" placeholder="Masukkan Username/NIS" required></div>
                <div class="input-group"><label>Password</label><input type="password" id="password" class="input-text" placeholder="Masukkan Password" required></div>
                <button type="submit" class="btn-3d" id="btn-submit">MASUK</button>
                <div style="margin-top: 20px; font-size: 0.9rem;">Belum punya akun? <a href="registrasi.html">Daftar di sini</a></div>
            </form>
            <button id="btn-install-app" class="btn-3d" style="display:none; background:var(--info); margin-top:15px; width:100%;"><i class="fas fa-download"></i> Pasang Aplikasi</button>
        </div>
    </div>

    <script>
        // SCRIPT KEAMANAN PINTAR
        function isStaff() {
            try {
                let roles = JSON.parse(localStorage.getItem("userRole") || "[]");
                return roles.includes("admin") || roles.includes("guru");
            } catch(e) { return false; }
        }

        document.addEventListener('contextmenu', event => { if(!isStaff()) event.preventDefault(); });
        ['copy', 'cut', 'paste', 'selectstart', 'dragstart'].forEach(evt => document.addEventListener(evt, event => { 
            if (!isStaff() && event.target.tagName !== 'INPUT' && event.target.tagName !== 'TEXTAREA') { event.preventDefault(); } 
        }));
        
        document.addEventListener('keydown', event => {
            if(!isStaff()) {
                if (event.key === 'F12' || event.key === 'PrintScreen' || (event.ctrlKey && ['c', 'v', 'x', 'u', 'p', 's', 'a', 'f'].includes(event.key.toLowerCase())) || (event.ctrlKey && event.shiftKey && ['i', 'j', 'c', 's'].includes(event.key.toLowerCase()))) { 
                    event.preventDefault(); 
                }
            }
        });
        
        window.addEventListener('blur', () => { if(!isStaff()) document.body.style.filter = "blur(15px)"; });
        window.addEventListener('focus', () => { if(!isStaff()) document.body.style.filter = "none"; });

        // PWA Logika
        let deferredPrompt; const installBtn = document.getElementById('btn-install-app');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
        installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { installBtn.style.display = 'none'; } deferredPrompt = null; } });
    </script>
    <script type="module" src="index.js"></script>
</body>
</html>
