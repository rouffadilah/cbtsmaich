<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT-SMAICH - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* --- ANTI COPAS & ANTI AI --- */
        body { 
            -webkit-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        input { 
            -webkit-user-select: auto !important; 
            -ms-user-select: auto !important; 
            user-select: auto !important; 
        }
        /* --- ANTI PRINT / PDF --- */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body class="login-page-bg">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <img src="logo-smaich.png" alt="Logo SMAICH" class="main-logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
                <h2 id="portal-title">CBT-SMAICH</h2>
                <p>SMA ISLAM CIKAL HARAPAN I BSD</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label>Username / NIS / NIP</label>
                    <input type="text" id="username" class="input-text" placeholder="Masukkan ID Anda" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-text" placeholder="Masukkan Password" required>
                </div>
                
                <button type="submit" class="btn-3d" id="btn-submit" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> MASUK
                </button>

                <div style="margin-top: 20px; font-size: 0.9rem; text-align: center;">
                    Belum punya akun? <a href="registrasi.html" style="color: var(--primary); font-weight: bold; text-decoration: none;">Daftar di sini</a>
                </div>
            </form>
            
            <div class="login-footer" style="margin-top: 20px; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
                &copy; 2026 IT Support SMAICH. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        // Blokir Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Blokir Aksi Copy, Cut, dan Paste
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        // Blokir Shortcut Keyboard Pencarian (Ctrl+C, Ctrl+V, Ctrl+F, Inspect Element F12, Print/SS)
        document.addEventListener('keydown', event => {
            if (
                event.key === 'F12' || 
                event.key === 'PrintScreen' ||
                (event.ctrlKey && ['c', 'v', 'x', 'u', 'p', 's', 'a', 'f'].includes(event.key.toLowerCase())) ||
                (event.ctrlKey && event.shiftKey && ['i', 'j', 'c', 's'].includes(event.key.toLowerCase()))
            ) {
                event.preventDefault();
            }
        });

        // ========================================================
        // JEBAKAN TOMBOL BACK (Mencegah Keluar Aplikasi di HP)
        // ========================================================
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function(event) {
            // Ketika tombol back ditekan, paksa tetap di halaman ini
            history.pushState(null, null, location.href);
        });
    </script>

    <script type="module" src="index.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('Service Worker berhasil didaftarkan! Scope: ', registration.scope);
            })
            .catch(err => {
              console.log('Pendaftaran Service Worker gagal: ', err);
            });
        });
      }
    </script>
</body>
</html>
