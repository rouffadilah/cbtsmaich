name: Activate dashboard correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate correction script
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          text = p.read_text(encoding='utf-8')
          tag = '    <script type="module" src="dashboard-fix.js"></script>'
          marker = '    <script type="module" src="dashboard.js"></script>'
          if 'src="dashboard-fix.js"' not in text:
              if marker not in text:
                  raise SystemExit('dashboard.js script tag not found')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          print('dashboard-fix.js activated')

      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No dashboard change needed."
          else
            git commit -m "fix: activate per-question dashboard grading"
            git push
          fi
