name: Fix attempt.js syntax and cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair attempt.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('attempt.js')
          s = p.read_text(encoding='utf-8')
          old = "<button onclick=\"window.location.href='/dashboard#section-beranda'\" class=\"btn-3d\" style=\"margin-top:20px;padding:12px 24px;\">Kembali ke Dashboard</button>"
          new = "<button onclick=\"window.location.href=\\\"/dashboard#section-beranda\\\"\" class=\"btn-3d\" style=\"margin-top:20px;padding:12px 24px;\">Kembali ke Dashboard</button>"
          if old not in s:
              raise SystemExit('Target syntax string not found; aborting without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Bump attempt.js cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('attempt.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('attempt.js?v=20260915.1', 'attempt.js?v=20261003.1')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check attempt.js

      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attempt.js attempt.html
          git diff --cached --quiet && echo 'No changes needed.' && exit 0
          git commit -m 'fix: restore attempt page data loading'
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-attempt-dropdown.yml
          git add .github/workflows/fix-attempt-dropdown.yml
          git commit -m 'chore: remove temporary repair workflow'
          git push
