<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Berbasis Komputer - SMAICH</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="app-header" style="justify-content: space-between;">
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo-smaich.png" alt="Logo SMAICH" style="height: 45px; width: auto; object-fit: contain;">
            <div style="display: flex; flex-direction: column; justify-content: center;">
                <h1 style="font-size: 1.25rem; font-weight: 700; color: var(--secondary); margin: 0; line-height: 1.2;">CBT SMAICH</h1>
                <p style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin: 0;">SMA Islam Cikal Harapan I BSD</p>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="display: flex; flex-direction: row; align-items: center; justify-content: flex-end; gap: 12px; background: #f8fafc; padding: 8px 18px; border-radius: 30px; border: 1px solid var(--border-color); white-space: nowrap; width: max-content;">
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin: 0;">PESERTA:</span>
                <span class="user-name" id="student-name" style="font-weight: 700; color: var(--secondary); font-size: 0.95rem; margin: 0;">Memuat Nama...</span>
                <span style="color: #cbd5e1; font-size: 1.2rem; line-height: 1; margin: 0;">|</span>
                <span id="live-time-student" style="color: var(--primary); font-weight: 700; font-size: 0.85rem; margin: 0;">00:00:00 WIB</span>
            </div>
            <div style="background: var(--primary-light); padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-user-graduate" style="color: var(--primary); font-size: 1.5rem;"></i>
            </div>
        </div>

    </header>
    
    <section id="pre-exam-section" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 550px; padding: 40px; text-align: center;">
            <i class="fas fa-laptop-code fa-3x" style="color: var(--primary); margin-bottom: 20px;"></i>
            
            <h2 id="greeting-peserta" style="margin-bottom: 15px; color: var(--secondary); font-size: 1.3rem; line-height: 1.5;">Assalamu'alaikum...</h2>
            
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">Pilih mata pelajaran dan masukkan token dari pengawas.</p>

            <div class="input-group" style="text-align: left;">
                <label>Mata Pelajaran</label>
                <select id="select-mapel" class="input-text">
                    <option value="" disabled selected>Memuat Mata Pelajaran...</option>
                </select>
            </div>

            <div class="input-group" style="text-align: left;">
                <label>Token Ujian</label>
                <input type="text" id="input-token" class="input-text" placeholder="Contoh: SMAICH-XXXX" style="text-transform: uppercase;">
            </div>

            <div id="token-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: 600;">
                <i class="fas fa-exclamation-triangle"></i> Token tidak valid atau salah!
            </div>

            <button id="btn-verifikasi" class="btn-3d" style="width: 100%;"><i class="fas fa-key"></i> VERIFIKASI & MULAI</button>
        </div>
    </section>
    
    <main class="exam-layout" id="main-exam-layout" style="display: none;">
        <section class="question-section">
            <div class="card question-card">
                <div class="question-header">
                    <div>
                        <span class="q-number-label">SOAL NOMOR</span>
                        <div class="q-number-badge" id="current-q-num">1</div>
                    </div>
                    <div id="badge-tipe-soal" style="background: var(--info); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;">TIPE SOAL</div>
                </div>
                
                <div class="question-content" id="q-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 50px 0;">
                        <i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 10px;"></i>
                        <p>Memuat soal...</p>
                    </div>
                </div>

                <div class="nav-controls">
                    <button class="nav-btn btn-prev" id="prev-btn"><i class="fas fa-chevron-left"></i> SEBELUMNYA</button>
                    <button class="nav-btn btn-doubt" id="doubt-btn"><i class="far fa-flag"></i> RAGU-RAGU</button>
                    <button class="nav-btn btn-next" id="next-btn">SELANJUTNYA <i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </section>

        <aside class="sidebar-panel">
            <div class="card timer-card">
                <h3><i class="far fa-clock"></i> SISA WAKTU</h3>
                <div class="time-display" id="timer">01:30:00</div>
            </div>

            <div class="card navigation-card">
                <h3 style="font-size: 0.9rem; color: var(--text-muted); text-align: center;"><i class="fas fa-th"></i> NAVIGASI SOAL</h3>
                
                <div class="q-grid" id="q-grid"></div>
                
                <div class="legend-container">
                    <div class="leg-item"><span class="leg-box answered"></span> Terjawab</div>
                    <div class="leg-item"><span class="leg-box doubt"></span> Ragu-Ragu</div>
                    <div class="leg-item"><span class="leg-box active-q" style="border: 2px solid var(--info); background: transparent;"></span> Sedang Dibuka</div>
                </div>
            </div>

            <button class="btn-finish-exam" id="finish-btn">
                <i class="fas fa-check-double"></i> SELESAI UJIAN
            </button>
        </aside>
    </main>

    <script type="module" src="attempt.js"></script>
</body>
</html>
