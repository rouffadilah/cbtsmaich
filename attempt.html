<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Ujian CBT - SMA Islam Cikal Harapan 1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- KEAMANAN GLOBAL & UI SPESIFIK UJIAN --- */
        body { 
            -webkit-user-select: none !important; 
            -moz-user-select: none !important; 
            -ms-user-select: none !important; 
            user-select: none !important; 
            -webkit-touch-callout: none !important; 
            background-color: var(--bg-main); 
        }
        input, textarea, select { 
            -webkit-user-select: auto !important; 
            -ms-user-select: auto !important; 
            user-select: auto !important; 
        }
        img { pointer-events: none; -webkit-user-drag: none; }
        @media print { print { body { display: none !important; } } }
        
        .pre-exam-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .pre-exam-card { background: white; padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 500px; text-align: center; }
        .warning-box { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; text-align: left; }
        
        #exam-workspace { display: none; height: 100vh; flex-direction: column; overflow: hidden; background: var(--bg-main); }
        .exam-body { display: flex; flex: 1; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%; position: relative; }
        .question-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; background: white; border-right: 1px solid var(--border-color); }
        .sidebar-area { width: 320px; background: #f8fafc; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; }
        .nav-bottom-container { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 20px; gap: 10px; margin-top: auto; }
        
        /* --- KOTAK NAVIGASI SOAL --- */
        .q-box {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            color: #475569;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            padding: 10px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .q-box:hover { background-color: #f1f5f9; border-color: #94a3b8; }
        .q-box.filled { background-color: #10b981; border-color: #059669; color: #ffffff; }
        .q-box.ragu { background-color: #f59e0b !important; border-color: #d97706 !important; color: #ffffff !important; }
        .q-box.active { border-color: #3b82f6 !important; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }

        /* --- RESPONSIVITAS MOBILE --- */
        @media screen and (max-width: 1024px) {
            body, html { overflow: hidden !important; height: 100% !important; }
            .pre-exam-container { align-items: flex-start; padding: 15px; overflow-y: auto; height: 100dvh; }
            #exam-workspace { height: 100dvh !important; }
            .question-area { padding: 20px 15px 90px 15px !important; border: none; } 
            .nav-bottom-container { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 12px 15px; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 100; margin: 0; }
            .nav-bottom-container button { width: 60px; justify-content: center; }
            .nav-bottom-container label { flex: 1; white-space: nowrap; justify-content: center; }
            .btn-toggle-nav { display: none !important; } 
            #btn-fab-nav { display: flex !important; } 
            #btn-close-sidebar { display: block !important; }
        }
    </style>
</head>
<body>
    <script>
        (function() {
            // 1. Logika Auto-Theme Berdasarkan Waktu
            const currentHour = new Date().getHours();
            const isNightTime = currentHour >= 18 || currentHour < 6;
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && isNightTime)) {
                document.body.classList.add('dark-mode');
                if (!savedTheme) localStorage.setItem('theme', 'dark'); 
            } else if (savedTheme === 'light' || (!savedTheme && !isNightTime)) {
                document.body.classList.remove('dark-mode');
                if (!savedTheme) localStorage.setItem('theme', 'light');
            }

            // 2. Logika Fullscreen Otomatis Giras (Mode ANBK)
            function pemicuFullscreenANBK() {
                const docEl = document.documentElement;
                const isFull = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (!isFull) {
                    if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(() => {}); }
                    else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }
                    else if (docEl.msRequestFullscreen) { docEl.msRequestFullscreen(); }
                }
            }
            // HANYA GUNAKAN EVENT KLIK/SENTUH AGAR TIDAK ERROR DI CONSOLE
            ['click', 'touchstart', 'keydown', 'dblclick'].forEach(evt => {
                document.addEventListener(evt, pemicuFullscreenANBK, { passive: true });
            });

            // 3. Logika Jam & Tanggal Real-time di Bawah Logo
            function inisialisasiJamSistem() {
                // Target semua elemen jam baik menggunakan ID maupun Class
                const clockEls = document.querySelectorAll('#realtime-clock, .realtime-clock, .realtime-clock-display');
                if (clockEls.length === 0) return;
                function perbaruiWaktu() {
                    const sekarang = new Date();
                    const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    const strTanggal = sekarang.toLocaleDateString('id-ID', opsiTanggal);
                    const strJam = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
                    
                    clockEls.forEach(el => {
                        el.innerHTML = `<i class="far fa-calendar-alt"></i> ${strTanggal} &nbsp;|&nbsp; <i class="far fa-clock"></i> ${strJam} WIB`;
                    });
                }
                perbaruiWaktu();
                setInterval(perbaruiWaktu, 1000);
            }
            document.addEventListener('DOMContentLoaded', inisialisasiJamSistem);
        })();
    </script>

    <div id="pre-exam-ui" class="login-page-bg">
        <div class="login-container" style="margin: 0 auto;">
            <div class="login-card" style="text-align: center; padding: 35px 30px;">
                <div class="login-header" style="margin-bottom: 20px;">
                    <span class="login-badge" style="margin-bottom: 12px;"><i class="fas fa-file-signature"></i> Portal Ujian</span>
                    <img src="logo-smaich.png" alt="Logo SMA ICH" class="main-logo" style="margin: 0 auto 8px auto; height: 70px;" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
                    
                    <div id="realtime-clock" class="realtime-clock" style="margin: 0; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Menghubungkan waktu server...</div>
                </div>

                <h2 id="welcome-student" style="margin-bottom: 20px; font-size: 0.85rem; font-weight: 400; color: var(--secondary);">Memuat Data...</h2>

                <div class="warning-box" style="margin-bottom: 25px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; border-radius: 8px; padding: 12px 15px; font-size: 0.8rem; text-align: left; line-height: 1.5;">
                    <div style="font-weight: 700; margin-bottom: 4px; font-size: 0.85rem;"><i class="fas fa-shield-alt"></i> Pengawasan Aktif</div>
                    Keluar dari layar penuh atau membuka tab lain akan otomatis memicu pelanggaran sistem.
                </div>

                <div class="input-group" style="text-align: left; margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 0.85rem; color: var(--secondary);">Kelas Anda (Otomatis)</label>
                    <input type="text" id="student-class" class="input-text" readonly style="background: #f8fafc; font-weight: 700; color: var(--text-muted); cursor: not-allowed; border-color: var(--border-color);">
                </div>

                <div class="input-group" style="text-align: left; margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 0.85rem; color: var(--secondary);">Mata Pelajaran Ujian</label>
                    <select id="select-mapel" class="input-text" style="font-weight: 600; background: #ffffff;">
                        <option value="">Memuat mata pelajaran...</option>
                    </select>
                </div>

                <div class="input-group" style="text-align: left; margin-bottom: 25px;">
                    <label style="font-weight: 600; font-size: 0.85rem; color: var(--secondary);">Token Ujian</label>
                    <input type="text" id="input-token" class="input-text" placeholder="KODE 6 DIGIT" style="text-transform: uppercase; font-size: 1.15rem; font-weight: 800; letter-spacing: 4px; text-align: center; background: #ffffff; color: var(--danger);">
                </div>

                <button id="btn-verifikasi" class="btn-3d" style="width: 100%; padding: 12px; font-size: 0.95rem;"><i class="fas fa-play-circle"></i> MULAI UJIAN</button>
                <button onclick="window.location.replace('index.html')" class="btn-exit-modern" style="width: 100%; justify-content: center; margin-top: 12px; padding: 10px; font-size: 0.85rem;"><i class="fas fa-arrow-left"></i> Batal & Kembali</button>
            </div>
        </div>
    </div>

    <div id="exam-workspace">
        <header class="exam-header" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm); z-index: 10; gap: 10px;">
            <div style="display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 0;">
                <img src="logo-smaich.png" alt="Logo" style="height: 18px; width: auto; object-fit: contain; object-position: left; margin-bottom: 6px;" onerror="this.src='https://via.placeholder.com/80x18?text=CBT'">
                
                <h3 id="exam-mapel-title" style="margin: 0; font-size: 1.05rem; color: var(--secondary); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</h3>
                <p id="exam-student-name" style="margin: 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</p>
                <div class="realtime-clock-display" style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                <button id="btn-toggle-sidebar" class="btn-toggle-nav btn-3d btn-secondary" style="padding: 8px 10px; margin: 0; font-size: 1rem;"><i class="fas fa-th-large"></i></button>
            </div>
        </header>

        <div class="exam-body">
            <main class="question-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed var(--border-color);">
                    <div style="font-size: 1.2rem; font-weight: 800; color: var(--secondary);">Soal No. <span id="current-q-num" style="color: var(--primary); font-size: 1.5rem;">1</span></div>
                    
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--border-color); background: var(--card-bg);">
                            <i class="fas fa-stopwatch" style="color: var(--danger); font-size: 0.9rem;"></i>
                            <span id="timer-display" style="font-family: monospace; font-size: 1.05rem; font-weight: 800; color: var(--danger); letter-spacing: 1px;">00:00:00</span>
                        </div>
                        
                        <div id="badge-tipe-soal" style="background: var(--info); color: white; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.5px;">-</div>
                    </div>
                </div>
                
                <div id="soal-content" style="flex: 1;">
                    </div>

                <div class="nav-bottom-container">
                    <button id="btn-prev" class="btn-3d btn-secondary" style="margin: 0; font-size: 1.2rem; width: 60px;"><i class="fas fa-chevron-left"></i></button>
                    
                    <label class="btn-3d" style="background-color: var(--warning); margin: 0; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px 20px;">
                        <input type="checkbox" id="cb-ragu" style="transform: scale(1.3); margin: 0;"> Ragu-ragu
                    </label>
                    
                    <button id="btn-next" class="btn-3d" style="margin: 0; font-size: 1.2rem; width: 60px;"><i class="fas fa-chevron-right"></i></button>
                </div>
            </main>

            <aside id="sidebar-nav" class="sidebar-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0; font-size: 1.1rem; color: var(--secondary);"><i class="fas fa-list-ol"></i> Navigasi Soal</h3>
                    <button id="btn-close-sidebar" style="display: none; background: transparent; border: none; font-size: 1.2rem; color: var(--text-muted); cursor: pointer;"><i class="fas fa-times"></i></button>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; font-size: 0.8rem; background: white; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="display: flex; align-items: center; gap: 5px;"><div style="width:12px; height:12px; background:var(--success); border-radius:3px;"></div> Terjawab</div>
                    <div style="display: flex; align-items: center; gap: 5px;"><div style="width:12px; height:12px; background:white; border:1px solid #cbd5e1; border-radius:3px;"></div> Belum</div>
                    <div style="display: flex; align-items: center; gap: 5px;"><div style="width:12px; height:12px; background:var(--warning); border-radius:3px;"></div> Ragu</div>
                </div>

                <div id="grid-nav-soal" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; overflow-y: auto; align-content: start;">
                    </div>
                
                <div style="margin-top: auto; padding-top: 20px; text-align: center;">
                    <div style="font-size: 0.8rem; color: var(--danger); margin-bottom: 10px; font-weight: bold;"><i class="fas fa-exclamation-triangle"></i> Pelanggaran: <span id="violation-count">0</span>/3</div>
                    <button id="btn-selesai-ujian" class="btn-3d" style="width: 100%; margin: 0; background-color: var(--danger);"><i class="fas fa-flag-checkered"></i> Selesai</button>
                </div>
            </aside>
            <div id="overlay-sidebar" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;"></div>
        </div>

        <button id="btn-fab-nav" style="display: none; position: fixed; bottom: 80px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--secondary); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 99; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer;">
            <i class="fas fa-th-large"></i>
        </button>
    </div>

    <div id="modal-custom-alert" class="modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; align-items: center; justify-content: center; z-index: 10000; background: rgba(15,23,42,0.8);">
        <div class="modal-content" style="background: white; width: 400px; max-width: 90%; text-align: center; padding: 35px 25px; border-radius: 10px;">
            <i class="fas fa-info-circle fa-4x" style="color: var(--info); margin-bottom: 15px;"></i>
            <h3 id="alert-title" style="margin-bottom: 10px;">Informasi</h3>
            <p id="alert-message" style="margin-bottom: 25px; color: #475569;">Pesan</p>
            <button id="btn-alert-ok" class="btn-3d" style="width: 100%;">OK, Mengerti</button>
        </div>
    </div>
    <script type="module" src="attempt.js"></script>
</body>
</html>
